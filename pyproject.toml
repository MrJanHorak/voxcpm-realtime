[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "voxcpm-realtime"
version = "0.1.0"
description = "VoxCPM2 LoRA voice compatibility validator and API scaffold"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "safetensors>=0.4,<1", "numpy>=1.24,<3", "httpx>=0.27,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "soundfile>=0.12,<1"]
inference = ["voxcpm==2.0.3", "soundfile>=0.12,<1"]
playback = ["sounddevice>=0.5,<1"]
watermark = ["resemble-perth==1.0.1", "soundfile>=0.12,<1"]
[project.scripts]
voicecheck = "voxcpm_realtime.cli:main"
voxcpm-speak = "voxcpm_realtime.speak:main"
voxcpm-benchmark = "voxcpm_realtime.benchmark:main"
voxcpm-stream = "voxcpm_realtime.stream:main"
voxcpm-voices = "voxcpm_realtime.voices:main"
voxcpm-client = "voxcpm_realtime.client:main"
voxcpm-manager = "voxcpm_realtime.voice_manager:main"
voxcpm-install-runtime = "voxcpm_realtime.install_runtime:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
