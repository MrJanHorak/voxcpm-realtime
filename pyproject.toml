[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "voxcpm-realtime"
version = "0.1.0"
description = "VoxCPM2 LoRA voice compatibility validator and API scaffold"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "safetensors>=0.4,<1", "numpy>=1.24,<3"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
[project.scripts]
voicecheck = "voxcpm_realtime.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
